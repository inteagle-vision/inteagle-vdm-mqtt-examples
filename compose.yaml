name: inteagle-vdm-live

x-device-environment: &device-environment
  MQTT_HOST: ${MQTT_HOST:-nanomq}
  MQTT_PORT: ${MQTT_PORT:-1883}
  MQTT_USERNAME:
  MQTT_PASSWORD:
  VDM_DEVICE_ID: ${VDM_DEVICE_ID:-}
  VDM_PAYLOAD_FORMAT: ${VDM_PAYLOAD_FORMAT:-protobuf}

services:
  nanomq:
    image: ${NANOMQ_IMAGE:-emqx/nanomq:0.25.2-2@sha256:8d391c73eb084a32accbe13516bbea83e33736542da9ea755c3b3b3417378961}
    ports:
      - "${NANOMQ_BIND_ADDRESS:-127.0.0.1}:${NANOMQ_PORT:-18883}:1883"
    restart: unless-stopped

  python-data: &python-service
    image: inteagle-vdm-python:local
    build:
      context: .
      dockerfile: python/Dockerfile
    entrypoint: ["python", "/app/receive_data.py"]
    command: []
    environment: *device-environment
    depends_on: [nanomq]

  go-data: &go-service
    image: inteagle-vdm-go:local
    build:
      context: .
      dockerfile: go/Dockerfile
    entrypoint: ["/vdm-receive-data"]
    command: []
    environment: *device-environment
    depends_on: [nanomq]

  java-data: &java-service
    image: inteagle-vdm-java:local
    build:
      context: .
      dockerfile: java/Dockerfile
    entrypoint: ["java", "-cp", "/app/vdm-mqtt-consumer.jar", "com.inteagle.examples.vdm.ReceiveData"]
    command: []
    environment: *device-environment
    depends_on: [nanomq]

  javascript-data: &javascript-service
    image: inteagle-vdm-javascript:local
    build:
      context: .
      dockerfile: javascript/Dockerfile
    entrypoint: ["node", "receive_data.js"]
    command: []
    environment: *device-environment
    depends_on: [nanomq]

  python-evidence:
    <<: *python-service
    profiles: [evidence]
    entrypoint: ["python", "/app/evidence_receiver.py"]
    environment:
      <<: *device-environment
      VDM_EVIDENCE_DIR: /data/evidence
    volumes: [python-evidence:/data/evidence]

  go-evidence:
    <<: *go-service
    profiles: [evidence]
    entrypoint: ["/vdm-evidence-receiver"]
    environment:
      <<: *device-environment
      VDM_EVIDENCE_DIR: /data/evidence
    volumes: [go-evidence:/data/evidence]

  java-evidence:
    <<: *java-service
    profiles: [evidence]
    entrypoint: ["java", "-cp", "/app/vdm-mqtt-consumer.jar", "com.inteagle.examples.vdm.EvidenceReceiver"]
    environment:
      <<: *device-environment
      VDM_EVIDENCE_DIR: /data/evidence
    volumes: [java-evidence:/data/evidence]

  javascript-evidence:
    <<: *javascript-service
    profiles: [evidence]
    entrypoint: ["node", "evidence_receiver.js"]
    environment:
      <<: *device-environment
      VDM_EVIDENCE_DIR: /data/evidence
    volumes: [javascript-evidence:/data/evidence]

volumes:
  python-evidence:
  go-evidence:
  java-evidence:
  javascript-evidence:
