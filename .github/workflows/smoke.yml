name: MQTT examples smoke test

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan current files and Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          install_dir="${RUNNER_TEMP}/gitleaks-${version}"
          mkdir -p "${install_dir}"
          curl --fail --location --silent --show-error \
            --output "${install_dir}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${expected_sha256}  ${install_dir}/${archive}" | sha256sum --check --strict
          tar -xzf "${install_dir}/${archive}" -C "${install_dir}" gitleaks
          "${install_dir}/gitleaks" git --redact=100 --no-banner .

  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify Protobuf and JSON examples
        run: ./tests/run_smoke.sh all

  reference-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate bindings and run all language suites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sha256sum --check proto/SHA256SUMS
          python -m venv python/.venv
          python/.venv/bin/pip install -r python/requirements.lock
          python/.venv/bin/python -m grpc_tools.protoc -Iproto --python_out=python proto/inteagle_vdm_mqtt_v1.proto
          (cd python && .venv/bin/python -m unittest discover -s tests)
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          mkdir -p go/generated go/bin
          protoc -Iproto --go_out=go/generated --go_opt=paths=source_relative proto/inteagle_vdm_mqtt_v1.proto
          (cd go && go test -race ./... && go vet ./... && go build -o bin/vdm-service ./cmd/service)
          (cd java && mvn --batch-mode --no-transfer-progress package)
          (cd javascript && npm ci && npm run check)
          python tools/build_contract.py
          git diff --exit-code contracts/openapi.json
      - name: Independent brokers and simulated devices against every service
        run: ./tests/run_services.sh
      - name: Verify service images build with locked dependencies
        env:
          VDM_API_TOKEN: ci-compose-validation-token
        run: docker compose -f compose.services.yaml --profile python --profile go --profile java --profile javascript build
      - name: Start every container and verify volume permissions and HTTP auth
        env:
          VDM_API_TOKEN: ci-compose-validation-token
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f compose.services.yaml --profile python --profile go --profile java --profile javascript)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up --no-build -d
          python - <<'PY'
          import json, os, time, urllib.request
          for port in range(8081, 8085):
              for attempt in range(120):
                  try:
                      health = json.load(urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=2))
                      if health['status'] == 'ok':
                          break
                  except OSError:
                      pass
                  time.sleep(0.5)
              else:
                  raise SystemExit(f'container on {port} did not become ready')
              request = urllib.request.Request(f'http://127.0.0.1:{port}/v1/devices', headers={'Authorization': 'Bearer ' + os.environ['VDM_API_TOKEN']})
              assert len(json.load(urllib.request.urlopen(request, timeout=2))['devices']) == 1
          PY
